name: Publish langchain-x402bazaar to PyPI

# Tokenless PyPI publishing via OIDC "trusted publishing".
# One-time setup (user): on pypi.org add a *pending* trusted publisher →
#   PyPI project name: langchain-x402bazaar
#   Owner: sukrutkrdg · Repository: x402-bazaar-plugins
#   Workflow: publish-langchain.yml
# Then publish by creating a GitHub Release (or running this workflow manually).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        working-directory: langchain
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: langchain/dist
